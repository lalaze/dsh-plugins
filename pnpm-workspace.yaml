packages:
  - packages/*

onlyBuiltDependencies:
  - esbuild

# Published DSH UI bundles import these packages but list them as devDependencies.
# Keep the host module intact for browser-component regression tests.
packageExtensions:
  '@deepseek-ai/dsh-client-store@0.2.1-rc.2':
    dependencies:
      zustand: ~4.5.7
      immer: ^10.1.1
  '@deepseek-ai/dsh-client-ui-primitives@0.2.1-rc.2':
    dependencies:
      '@deepseek-ai/dsh-client-store': 0.2.1-rc.2
      '@deepseek-ai/dsh-util-code-language': 0.2.1-rc.2
      '@deepseek-ai/dsh-util-workspace-path': 0.2.1-rc.2
      clsx: ^2.0.0
      diff: ^9.0.0
      anser: ^2.3.5
      katex: ^0.18.7
      shiki: ^4.4.3
      '@shikijs/langs': ^4.4.3
      simple-icons: 16.31.0
      micromark-core-commonmark: ^2.0.3
      micromark-util-character: ^2.1.1
      micromark-util-classify-character: ^2.0.1
      micromark-util-symbol: ^2.0.1
      micromark-factory-space: ^2.0.1
      micromark-extension-math: ^3.1.0
      mdast-util-from-markdown: ^2.0.3
      mdast-util-gfm: ^3.1.0
      mdast-util-math: ^3.0.0
      micromark-extension-gfm: ^3.0.0
      micromark-util-sanitize-uri: ^2.0.1
  # dsh-workspace-tags vendors ui-workspace 0.2.1-rc.3. These rc.3 packages import
  # DSH types they do not declare; pin them to rc.3 rather than the hoisted rc.2.
  '@deepseek-ai/dsh-client-store@0.2.1-rc.3':
    dependencies:
      zustand: ~4.5.7
      immer: ^10.1.1
  '@deepseek-ai/dsh-client-ui-primitives@0.2.1-rc.3':
    dependencies:
      '@deepseek-ai/dsh-client-store': 0.2.1-rc.3
      '@deepseek-ai/dsh-util-code-language': 0.2.1-rc.3
      '@deepseek-ai/dsh-util-workspace-path': 0.2.1-rc.3
      clsx: ^2.0.0
      diff: ^9.0.0
      anser: ^2.3.5
      katex: ^0.18.7
      shiki: ^4.4.3
      '@shikijs/langs': ^4.4.3
      simple-icons: 16.31.0
      micromark-core-commonmark: ^2.0.3
      micromark-util-character: ^2.1.1
      micromark-util-classify-character: ^2.0.1
      micromark-util-symbol: ^2.0.1
      micromark-factory-space: ^2.0.1
      micromark-extension-math: ^3.1.0
      mdast-util-from-markdown: ^2.0.3
      mdast-util-gfm: ^3.1.0
      mdast-util-math: ^3.0.0
      micromark-extension-gfm: ^3.0.0
      micromark-util-sanitize-uri: ^2.0.1
  '@deepseek-ai/dsh-api-gateway@0.2.1-rc.3':
    dependencies:
      '@deepseek-ai/dsh-client-connection': 0.2.1-rc.3
  '@deepseek-ai/dsh-api-remotes@0.2.1-rc.3':
    dependencies:
      '@deepseek-ai/dsh-client-connection': 0.2.1-rc.3
      '@deepseek-ai/dsh-llm': 0.2.1-rc.3
      '@deepseek-ai/dsh-session': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-file-upload@0.2.1-rc.3':
    dependencies:
      '@deepseek-ai/dsh-session': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-product-analytics@0.2.1-rc.3':
    dependencies:
      '@deepseek-ai/dsh-llm': 0.2.1-rc.3
      '@deepseek-ai/dsh-session': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-ui-conversation@0.2.1-rc.3':
    dependencies:
      '@deepseek-ai/dsh-llm': 0.2.1-rc.3
      '@deepseek-ai/dsh-session': 0.2.1-rc.3
  '@deepseek-ai/dsh-client-ui-session@0.2.1-rc.3':
    dependencies:
      '@deepseek-ai/dsh-session': 0.2.1-rc.3
