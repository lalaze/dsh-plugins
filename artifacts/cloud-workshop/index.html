      <button class="control icon-only" id="fullscreen" type="button" aria-label="全屏欣赏" title="全屏欣赏"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4m6 0h4v4M3 13v4h4m6 0h4v-4"/></svg></button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  (() => {
    const svg = document.getElementById('illustration');
    const frame = document.getElementById('frame');
    const play = document.getElementById('play');
    const label = document.getElementById('play-label');
    const icon = document.getElementById('play-icon');
    const status = document.getElementById('status-text');
    const dot = document.getElementById('status-dot');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = reducedMotion.matches, speedIndex = 1, night = false, toastTimer;
    const speeds = [.5, 1, 1.5, 2];
    function syncPlay() {
      svg.classList.toggle('paused', paused);
      play.setAttribute('aria-pressed', String(paused));
      play.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      label.textContent = paused ? '继续飞行' : '暂停一下';
      icon.innerHTML = paused ? '<path d="m7 4 9 6-9 6Z"/>' : '<path d="M7 4v12M13 4v12"/>';
      status.textContent = paused ? '暂歇一朵云' : '正在云上赶工';
      dot.classList.toggle('still', paused);
      svg.getAnimations({subtree:true}).forEach(animation => { if(paused) animation.pause(); else animation.play(); });
    }
    function togglePlay() { paused = !paused; if(!paused) svg.classList.add('motion-enabled'); syncPlay(); }
    function toast(message) { const el = document.getElementById('toast'); clearTimeout(toastTimer); el.textContent = message; el.classList.add('visible'); toastTimer = setTimeout(() => el.classList.remove('visible'), 2400); }
    play.addEventListener('click', togglePlay);
    document.addEventListener('keydown', event => { if(event.code === 'Space' && !event.repeat && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(event.target.tagName) && !event.target.isContentEditable) { event.preventDefault(); togglePlay(); } });
    document.getElementById('speed').addEventListener('click', event => {
      speedIndex = (speedIndex + 1) % speeds.length;
      const rate = speeds[speedIndex];
      svg.getAnimations({subtree:true}).forEach(animation => animation.updatePlaybackRate(rate));
      event.currentTarget.textContent = rate + '× 速度';
      event.currentTarget.setAttribute('aria-label', '当前速度 ' + rate + ' 倍，点击切换');
    });
    document.getElementById('night').addEventListener('click', event => {
      night = !night; svg.classList.toggle('night', night); frame.classList.toggle('is-night', night);
      event.currentTarget.setAttribute('aria-pressed', String(night));
      event.currentTarget.setAttribute('aria-label', night ? '切换为白昼' : '切换为月夜');
      toast(night ? '月亮值班，梦想照常起飞。' : '天亮了，继续天马行空。');
    });
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try { if(document.fullscreenElement) await document.exitFullscreen(); else if(frame.requestFullscreen) await frame.requestFullscreen(); else toast('当前浏览器不支持全屏，可使用浏览器缩放欣赏。'); }
      catch { toast('可使用浏览器的全屏菜单欣赏。'); }
    });
    document.addEventListener('fullscreenchange', () => { document.getElementById('fullscreen').setAttribute('aria-label', document.fullscreenElement ? '退出全屏' : '全屏欣赏'); });
    document.getElementById('download').addEventListener('click', () => {
      // Save the original state so the offline HTML always opens consistently.
      const copy = document.documentElement.cloneNode(true);
      copy.querySelector('#illustration').classList.remove('paused','night','motion-enabled');
      copy.querySelector('#frame').classList.remove('is-night');
      copy.querySelector('#play').setAttribute('aria-label','暂停动画');
      copy.querySelector('#play').setAttribute('aria-pressed','false');
      copy.querySelector('#play-label').textContent = '暂停一下';
      copy.querySelector('#play-icon').innerHTML = '<path d="M7 4v12M13 4v12"/>';
      copy.querySelector('#speed').textContent = '1× 速度';
      copy.querySelector('#speed').setAttribute('aria-label','当前速度 1 倍，点击切换');
      copy.querySelector('#night').setAttribute('aria-pressed','false');
      copy.querySelector('#night').setAttribute('aria-label','切换为月夜');
      copy.querySelector('#fullscreen').setAttribute('aria-label','全屏欣赏');
      copy.querySelector('#status-dot').classList.remove('still');
      copy.querySelector('#status-text').textContent = '正在云上赶工';
      copy.querySelector('#toast').textContent = '';
      copy.querySelector('#toast').classList.remove('visible');
      const url = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + copy.outerHTML], {type:'text/html;charset=utf-8'}));
      const a = document.createElement('a'); a.href = url; a.download = '云上赶工.html'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('已保存，离线打开也能继续飞行。');
    });
    syncPlay();
  })();
</script>
